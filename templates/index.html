<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSphere Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(180deg, #f3fdf5 0%, #edf7ef 100%); font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { border: none; border-radius: 18px; box-shadow: 0 8px 24px rgba(21, 60, 33, 0.08); margin-bottom: 20px; }
        .eco-primary { background: linear-gradient(135deg, #1f7a3d, #2e9d5e); }
        .hidden { display: none !important; }
        .stat-value { font-size: 2rem; font-weight: 700; color: #1f7a3d; }
        .subtle { color: #5e6d63; }
        .section-title { font-weight: 700; color: #1b3d2d; }
        .list-group-item { border-radius: 10px; margin-bottom: 8px; }
        .mini-pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #eaf7ee; color: #1d6f3b; font-size: 0.8rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark eco-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🌍 EcoSphere Rewards</a>
        <button id="logoutBtn" class="btn btn-outline-light hidden" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container" id="authSection">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h4 class="text-center mb-4 section-title">Login / Register</h4>
                <div class="mb-3">
                    <input type="text" id="name" class="form-control" placeholder="Name (for registration only)">
                </div>
                <div class="mb-3">
                    <input type="email" id="email" class="form-control" placeholder="Email">
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Password">
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-success" onclick="login()">Login</button>
                    <button class="btn btn-outline-success" onclick="register()">Register</button>
                </div>
                <div id="authMessage" class="mt-3 text-center text-danger"></div>
            </div>
        </div>
    </div>
</div>

<div class="container hidden" id="dashboardSection">
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="subtle">Wallet Balance</div>
                <div class="stat-value" id="walletBalance">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="subtle">Eco Score</div>
                <div class="stat-value" id="ecoScore">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="subtle">Level</div>
                <div class="stat-value" id="currentLevel">1</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="subtle">Challenges</div>
                <div class="stat-value" id="challengeCount">0</div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card p-4">
                <h5 class="section-title mb-3">Log Activity</h5>
                <div class="mb-3">
                    <label class="form-label">Activity</label>
                    <select id="activitySelect" class="form-select">
                        <option value="1">Cycling (km)</option>
                        <option value="2">Recycling Plastic (kg)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="activityQty" class="form-control" placeholder="e.g. 5">
                </div>
                <button class="btn btn-success" onclick="submitActivity()">Submit Activity</button>
                <div id="activityMessage" class="mt-3 text-success"></div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card p-4">
                <h5 class="section-title mb-3">Impact Overview</h5>
                <div id="impactSummary" class="small text-muted">Loading...</div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card p-4">
                <h5 class="section-title mb-3">Challenges</h5>
                <div id="challengeList" class="d-grid gap-2"></div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card p-4">
                <h5 class="section-title mb-3">Rewards Catalog</h5>
                <div id="rewardList" class="d-grid gap-2"></div>
                <div id="rewardMessage" class="mt-3 text-info"></div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card p-4">
                <h5 class="section-title mb-3">Recent Activities</h5>
                <div id="activityList" class="list-group"></div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card p-4">
                <h5 class="section-title mb-3">Leaderboard</h5>
                <div id="leaderboardList" class="list-group"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api';
    let token = localStorage.getItem('eco_token');

    if (token) {
        showDashboard();
    }

    function authHeaders() {
        return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    }

    function setMessage(elementId, text, type = 'success') {
        const message = document.getElementById(elementId);
        message.textContent = text;
        message.className = `mt-3 text-${type}`;
    }

    async function register() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = await fetch(`${API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
            setMessage('authMessage', 'Registered! Please log in.', 'success');
        } else {
            setMessage('authMessage', data.error || data.message, 'danger');
        }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
            token = data.token;
            localStorage.setItem('eco_token', token);
            showDashboard();
        } else {
            setMessage('authMessage', data.error || 'Login failed', 'danger');
        }
    }

    function logout() {
        localStorage.removeItem('eco_token');
        token = null;
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
    }

    function showDashboard() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        loadDashboardData();
    }

    async function loadDashboardData() {
        try {
            const dashboardRes = await fetch(`${API_BASE}/dashboard`, { headers: authHeaders() });
            if (dashboardRes.status === 401) { logout(); return; }
            const dashboard = await dashboardRes.json();

            document.getElementById('walletBalance').textContent = dashboard.wallet?.balance ?? 0;
            document.getElementById('ecoScore').textContent = dashboard.eco_score ?? 0;
            document.getElementById('currentLevel').textContent = dashboard.level ?? 1;

            const impactText = dashboard.impact ? Object.entries(dashboard.impact.total_impact || {}).map(([k, v]) => `${k}: ${v.toFixed(2)}`).join(' • ') || 'No impact yet' : 'No impact yet';
            document.getElementById('impactSummary').innerHTML = `<div>${impactText}</div>`;

            const challengeRes = await fetch(`${API_BASE}/challenges/`, { headers: authHeaders() });
            const challengeData = await challengeRes.json();
            renderChallenges(challengeData.challenges || []);
            document.getElementById('challengeCount').textContent = (challengeData.challenges || []).length;

            const rewardsRes = await fetch(`${API_BASE}/rewards/`, { headers: authHeaders() });
            const rewardsData = await rewardsRes.json();
            renderRewards(rewardsData.rewards || []);

            const activityRes = await fetch(`${API_BASE}/activities/`, { headers: authHeaders() });
            const activityData = await activityRes.json();
            renderActivities(activityData.activities || []);

            const leaderboardRes = await fetch(`${API_BASE}/leaderboard`, { headers: authHeaders() });
            const leaderboardData = await leaderboardRes.json();
            renderLeaderboard(leaderboardData.leaderboard || []);
        } catch (error) {
            console.error(error);
        }
    }

    function renderChallenges(challenges) {
        const container = document.getElementById('challengeList');
        if (!challenges.length) {
            container.innerHTML = '<div class="text-muted">No challenges available.</div>';
            return;
        }

        container.innerHTML = challenges.map(challenge => `
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <strong>${challenge.title}</strong>
                    <span class="mini-pill">${challenge.type}</span>
                </div>
                <div class="small text-muted mt-2">Target: ${challenge.target_value} • Reward: ${challenge.reward_points} pts</div>
                <button class="btn btn-sm btn-outline-success mt-3" onclick="joinChallenge(${challenge.challenge_id})">Join</button>
            </div>
        `).join('');
    }

    function renderRewards(rewards) {
        const container = document.getElementById('rewardList');
        if (!rewards.length) {
            container.innerHTML = '<div class="text-muted">No rewards available.</div>';
            return;
        }

        container.innerHTML = rewards.map(reward => `
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <strong>${reward.name}</strong>
                    <span class="mini-pill">Tier ${reward.tier}</span>
                </div>
                <div class="small text-muted mt-2">${reward.points_required} pts • Stock: ${reward.stock}</div>
                <button class="btn btn-sm btn-success mt-3" onclick="redeemReward(${reward.reward_id})">Redeem</button>
            </div>
        `).join('');
    }

    function renderActivities(activities) {
        const container = document.getElementById('activityList');
        if (!activities.length) {
            container.innerHTML = '<div class="text-muted">No activity logged yet.</div>';
            return;
        }

        container.innerHTML = activities.slice(0, 6).map(activity => `
            <div class="list-group-item">
                <div class="d-flex justify-content-between">
                    <strong>${activity.activity_name}</strong>
                    <span class="mini-pill">${activity.status}</span>
                </div>
                <div class="small text-muted">${activity.quantity} • ${activity.points} pts</div>
            </div>
        `).join('');
    }

    function renderLeaderboard(entries) {
        const container = document.getElementById('leaderboardList');
        if (!entries.length) {
            container.innerHTML = '<div class="text-muted">Leaderboard unavailable.</div>';
            return;
        }

        container.innerHTML = entries.map((entry, index) => `
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>#${index + 1} ${entry.name}</strong><br>
                    <small class="text-muted">Score: ${entry.eco_score}</small>
                </div>
                <span class="mini-pill">Lvl ${entry.level}</span>
            </div>
        `).join('');
    }

    async function submitActivity() {
        const activity_id = document.getElementById('activitySelect').value;
        const quantity = document.getElementById('activityQty').value;

        const res = await fetch(`${API_BASE}/activities/`, {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ activity_id: parseInt(activity_id), quantity: parseFloat(quantity) })
        });
        const data = await res.json();
        if (res.ok) {
            setMessage('activityMessage', `Earned ${data.points_earned} points!`, 'success');
            document.getElementById('activityQty').value = '';
            loadDashboardData();
        } else {
            setMessage('activityMessage', data.error || 'Failed to log activity', 'danger');
        }
    }

    async function joinChallenge(challengeId) {
        const res = await fetch(`${API_BASE}/challenges/${challengeId}/join`, {
            method: 'POST',
            headers: authHeaders()
        });
        const data = await res.json();
        if (res.ok) {
            alert(data.message || 'Joined challenge');
            loadDashboardData();
        } else {
            alert(data.error || 'Could not join challenge');
        }
    }

    async function redeemReward(rewardId) {
        const res = await fetch(`${API_BASE}/rewards/${rewardId}/redeem`, {
            method: 'POST',
            headers: authHeaders()
        });
        const data = await res.json();
        if (res.ok) {
            setMessage('rewardMessage', data.message || 'Reward redeemed', 'info');
            loadDashboardData();
        } else {
            setMessage('rewardMessage', data.error || data.message, 'danger');
        }
    }
</script>
</body>
</html>
