services:
  - type: web
    name: ecosphere-rewards
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:create_app() --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecosphere-db
          property: connectionString

databases:
  - name: ecosphere-db
    databaseName: ecosphere
    user: ecosphere
